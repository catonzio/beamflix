[project]
name = "beamflix"
version = "0.1.0"
description = "Play movies and series on a Chromecast with Google TV via JustWatch deep links"
readme = "README.md"
authors = [
    { name = "Danilo Catone", email = "danilocatone@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
beamflix = "beamflix:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=beamflix --cov-branch --cov-report=term-missing"
